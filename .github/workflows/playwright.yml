name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:    # allow manual trigger from the GitHub Actions UI

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: Verify site reachability
        run: |
          echo "## Site Reachability Check" >> $GITHUB_STEP_SUMMARY
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 https://cleanrouter.com)
          echo "HTTP status: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "HTTP status from CI: $STATUS"

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run full test suite
        # Skip @visual tests in CI — baselines are captured on Windows and Ubuntu
        # renders fonts differently, causing unavoidable pixel-level mismatches.
        run: npx playwright test --grep-invert "@visual"
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          if [ -f "test-results/results.json" ]; then
            # Emit ::error:: annotations to stdout — runner interprets them as check-run annotations.
            # Must NOT be redirected to GITHUB_STEP_SUMMARY or the runner won't process them.
            node -e "
              const r = require('./test-results/results.json');
              function walk(suite, file) {
                if (suite.specs) suite.specs.forEach(spec => {
                  spec.tests.forEach(t => {
                    if (t.status !== 'expected' && t.status !== 'skipped') {
                      const err = t.results && t.results[0] && t.results[0].error;
                      const msg = (err ? err.message.split('\n')[0] : t.status).replace(/\n/g,' ').substring(0,200);
                      console.log('::error file=' + (file||'tests') + '::' + spec.title + ' [' + t.projectName + ']: ' + msg);
                    }
                  });
                });
                if (suite.suites) suite.suites.forEach(s => walk(s, file || s.file || ''));
              }
              r.suites.forEach(s => walk(s, s.file || ''));
            " || true

            # Write markdown summary separately (stdout goes to file, not interpreted as commands)
            {
              echo "## Playwright Test Results"
              echo ""
              echo "### Failed tests"
              node -e "
                const r = require('./test-results/results.json');
                const failed = [];
                function walk(suite, file) {
                  if (suite.specs) suite.specs.forEach(spec => {
                    spec.tests.forEach(t => {
                      if (t.status !== 'expected' && t.status !== 'skipped') {
                        const err = t.results && t.results[0] && t.results[0].error;
                        const msg = err ? err.message.split('\n')[0] : t.status;
                        failed.push('- **' + spec.title + '** [' + t.projectName + ']: ' + msg);
                      }
                    });
                  });
                  if (suite.suites) suite.suites.forEach(s => walk(s, file || s.file || ''));
                }
                r.suites.forEach(s => walk(s, s.file || ''));
                if (failed.length === 0) console.log('All tests passed.');
                else failed.forEach(f => console.log(f));
              " || echo "Could not parse results JSON."
            } >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "HTML report available in the \`playwright-report\` artifact." >> $GITHUB_STEP_SUMMARY
