name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:    # allow manual trigger from the GitHub Actions UI

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: Run smoke tests
        run: npm run test:smoke
        continue-on-error: false

      - name: Run full test suite
        # Skip @visual tests in CI — baselines are captured on Windows and Ubuntu
        # renders fonts differently, causing unavoidable pixel-level mismatches.
        run: npx playwright test --grep-invert "@visual"
        env:
          CI: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results/results.json" ]; then
            echo "Results JSON available in artifacts." >> $GITHUB_STEP_SUMMARY
          fi
          echo "HTML report available in the \`playwright-report\` artifact." >> $GITHUB_STEP_SUMMARY
